| `Especialista_firebird` | `firebird-redsis` |
| `Especialista_fiscal` | `fiscal-redsis` |
| `Especialista_git` | `git-redsis` |
| `QA` | `qa-redsis` |
| `SAC` | `sac-redsis` |
